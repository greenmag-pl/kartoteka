<!DOCTYPE html>
<html lang="pl">
	<head>
		<title>Kartoteka Zegarków - Notatki</title>
		<meta charset="utf-8">
		<link rel="icon" href="ikona.png" type="image/png">
		<script src="jquery.js"></script>
		<script>
			$(function()
			{
				$('p>span').text(' ' + new URLSearchParams(location.search).get('nazwa'));
				$.get('karty/karta' + new URLSearchParams(location.search).get('karta') + '/notatki.txt', function(txt)
				{
					$('pre').text(txt);
				});
			});
		</script>
		<style>
			@font-face
				{
				font-family:'inconsolata';
				src:url('inconsolata.ttf');
				}
			*
				{
				margin:0px;
				padding:0px;
				}
			body
				{
				margin:25px;
				background-color:#434955;
				}
			p
				{
				padding:10px 25px 25px 25px;
				font-family:arial;
				font-size:45px;
				color:#FDAB40;
				font-weight:bold;
				}
			span
				{
				color:#5DADEC;
				}
			pre
				{
				padding:25px;
				background-color:silver;
				border-style:none;
				border-radius:25px;
				letter-spacing:-1px;
				font-family:inconsolata;
				font-size:35px;
				color:#282B31;
				white-space:pre-wrap;
				overflow-wrap:break-word;
				}
		</style>
	</head>
	<body>
		<p>Notatki:<br><span></span></p>
		<pre></pre>
	</body>
</html>
