<!DOCTYPE html>
<html lang="pl">
	<head>
		<title>Kartoteka Zegarków - Notatki</title>
		<meta charset="utf-8">
		<link rel="icon" href="ikona.png" type="image/png">
		<script src="jquery.js"></script>
		<script>
			$(function()
			{
				$('p').html(new URLSearchParams(location.search).get('nazwa') + '<span> :notatki</span>');
				$.get('karty/karta' + new URLSearchParams(location.search).get('karta') + '/notatki.txt', function(txt)
				{
					$('pre').text(txt);
				});
			});
		</script>
		<style>
			*
				{
				margin:0px;
				padding:0px;
				}
			body
				{
				margin:25px;
				background-color:white;
				}
			p
				{
				padding:0px 25px;
				font-family:arial;
				font-size:40px;
				color:gray;
				font-weight:bold;
				}
			span
				{
				color:silver;
				font-weight:normal;
				}
			pre
				{
				margin-top:25px;
				padding:25px;
				background-color:silver;
				border-style:none;
				border-radius:25px;
				font-family:'courier new';
				font-size:35px;
				color:black;
				white-space:pre-wrap;
				overflow-wrap:break-word;
				}
		</style>
	</head>
	<body>
		<p></p>
		<pre></pre>
	</body>
</html>
