<!DOCTYPE html>
<html lang="pl">
	<head>
		<title>Kartoteka Zegarków - Notatki</title>
		<meta charset="utf-8">
		<link rel="icon" href="ikona.png" type="image/png">
		<script src="jquery.js"></script>
		<script>
			$(function()
			{
				$('p').text(new URLSearchParams(location.search).get('nazwa'));
				$.get('karty/karta' + new URLSearchParams(location.search).get('karta') + '/notatki.txt', function(txt)
				{
					$('pre').text(txt);
				});
			});
		</script>
		<style>
			*
				{
				margin:0px;
				padding:0px;
				}
			body
				{
				margin:25px;
				background-color:gray;
				}
			p
				{
				padding:10px 25px 25px 25px;
				font-family:arial;
				font-size:40px;
				color:white;
				font-weight:bold;
				}
			pre
				{
				padding:25px;
				background-color:silver;
				border-style:none;
				border-radius:25px;
				font-family:'courier new';
				font-size:35px;
				color:black;
				white-space:pre-wrap;
				overflow-wrap:break-word;
				line-height:28px;
				background-image:repeating-linear-gradient(to bottom, transparent 0px, transparent 55px, #afafaf 55px, #afafaf 56px);
				background-size:calc(100% - 50px) 56px;
				background-position:25px 53px;
				background-repeat:repeat-y;
				}
		</style>
	</head>
	<body>
		<p></p>
		<pre></pre>
	</body>
</html>
